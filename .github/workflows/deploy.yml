name: CI/CD Helm Deployment to EC2 Minikube

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout code (needed if you want to access the repo for any artifacts locally)
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2. Setup SSH key for EC2 access
    - name: Setup SSH Key
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.EC2_PRIVATE_KEY }}

    # 3. Add EC2 host to known_hosts
    - name: Add EC2 Host to known_hosts
      run: |
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

    # 4. Deploy Helm chart on EC2 Minikube
    - name: Deploy Helm Chart on EC2
      run: |
        ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
          # Navigate to the directory where your repo is cloned
          cd ~/myapp-repo  # replace with the path on EC2

          # Pull the latest changes from GitHub
          git pull origin main

          # Start Minikube if not running
          minikube status || minikube start --driver=docker

          # Upgrade or install Helm release
          helm repo update
          helm upgrade --install myapp ./helm/myapp \
            --namespace default \
            --create-namespace \
            --set image.tag=latest

          # Wait for all pods to be ready
          kubectl wait --for=condition=Ready pods --all -n default --timeout=180s

          # Verify pods
          kubectl get pods -n default
        EOF
