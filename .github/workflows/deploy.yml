name: CI/CD Helm Deployment to EC2 Minikube

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout code
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2. Setup SSH key for EC2 access
    - name: Setup SSH Key
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.EC2_PRIVATE_KEY }}

    # 3. Add EC2 host to known_hosts
    - name: Add EC2 Host to known_hosts
      run: |
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

    # 4. Deploy Helm chart on EC2
    - name: Deploy Helm Chart on EC2
      run: |
        ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
          # Clone repo if it does not exist
          if [ ! -d ~/Helm-Three-tier-Project- ]; then
              git clone https://github.com/ShahzaibInnovation/Helm-Three-tier-Project-.git ~/Helm-Three-tier-Project-
          fi

          # Navigate to repo folder
          cd ~/Helm-Three-tier-Project-

          # Pull latest changes
          git pull origin main

          # Start Minikube only if it is stopped
          if ! minikube status --format="{{.Host}}" | grep -q "Running"; then
              echo "Minikube is stopped. Starting Minikube..."
              minikube start --driver=docker --memory=2048
          else
              echo "Minikube is already running. Skipping start."
          fi

          # Add Helm repo if needed
          helm repo add stable https://charts.helm.sh/stable || true
          helm repo update

          # Upgrade or install Helm release
          helm upgrade --install myapp ./helm/myapp \
            --namespace default \
            --create-namespace \
            --set image.tag=latest

          # Wait for pods to be ready
          kubectl wait --for=condition=Ready pods --all -n default --timeout=300s

          # Verify pods
          kubectl get pods -n default
        EOF
